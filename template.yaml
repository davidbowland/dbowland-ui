AWSTemplateFormatVersion: 2010-09-09
Description: >-
  Infrastructure for dbowland.com UI

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - test
    Description: Environment for deploy

Mappings:
  EnvironmentMap:
    prod:
      bucketName: dbowland-ui-source
      certificate: adce1a21-90b4-4120-8548-111215e582f0
      domain: dbowland.com
      zoneId: Z072422417XWM8PIXXSFA
    test:
      bucketName: dbowland-ui-test
      certificate: 6a48cba7-feb9-4de5-8cbf-d383140fcdef
      domain: bowland.link
      zoneId: Z01312547RGU1BYKIJXY

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  # CDN

  OriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub
          - 'Access identity for ${Domain}'
          - Domain: !FindInMap [EnvironmentMap, !Ref Environment, domain]

  # www

  UiBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: PublicRead
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      BucketName: !FindInMap [EnvironmentMap, !Ref Environment, bucketName]
      Tags:
        - Key: 'created-by'
          Value: 'dbowland-ui'
        - Key: 'created-for'
          Value: 'dbowland'
        - Key: 'environment'
          Value: !Ref Environment

  UiBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UiBucket
      PolicyDocument:
        Statement:
          - Action: 's3:Get*'
            Effect: Allow
            Resource: !Sub 'arn:aws:s3:::${UiBucket}/*'
            Principal:
              CanonicalUser: !GetAtt OriginAccessIdentity.S3CanonicalUserId

  UiUrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          if (uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!/\.[^/]+$/.test(uri)) {
            request.uri += '/index.html';
          }

          return request;
        }
      FunctionConfig:
        Comment: !Sub
          - 'URL rewrite for ${Domain} - appends index.html to folder paths'
          - Domain: !FindInMap [EnvironmentMap, !Ref Environment, domain]
        Runtime: cloudfront-js-2.0
      Name: !Sub
        - '${Environment}-dbowland-ui-url-rewrite'
        - Environment: !Ref Environment

  UiCloudfrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !FindInMap [EnvironmentMap, !Ref Environment, domain]
        CustomErrorResponses:
          # The static export writes 400/403/500 as directories (trailingSlash: true),
          # so only 404.html exists as a bare file. CloudFront fetches error pages
          # directly from the origin, bypassing the URL-rewrite function, so these
          # paths must name the exported index.html explicitly.
          - ErrorCode: 400
            ResponseCode: 400
            ResponsePagePath: /400/index.html
          - ErrorCode: 403
            ResponseCode: 403
            ResponsePagePath: /403/index.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCode: 500
            ResponseCode: 500
            ResponsePagePath: /500/index.html
        DefaultCacheBehavior:
          AllowedMethods:
            - 'GET'
            - 'HEAD'
            - 'OPTIONS'
          CachePolicyId: '658327ea-f89d-4fab-a63d-7e88639e58f6' # Managed-CachingOptimized
          Compress: true
          DefaultTTL: 0
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UiUrlRewriteFunction.FunctionARN
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: 'redirect-to-https'
        DefaultRootObject: 'index.html'
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt UiBucket.RegionalDomainName
            Id: S3Origin
            S3OriginConfig:
              OriginAccessIdentity: !Sub
                - 'origin-access-identity/cloudfront/${Identity}'
                - Identity: !Ref OriginAccessIdentity
        PriceClass: 'PriceClass_100'
        ViewerCertificate:
          AcmCertificateArn: !Sub
            - 'arn:aws:acm:us-east-1:${AWS::AccountId}:certificate/${Certificate}'
            - Certificate: !FindInMap [EnvironmentMap, !Ref Environment, certificate]
          MinimumProtocolVersion: 'TLSv1.2_2021'
          SslSupportMethod: 'sni-only'
      Tags:
        - Key: 'created-by'
          Value: 'dbowland-ui'
        - Key: 'created-for'
          Value: 'dbowland'
        - Key: 'environment'
          Value: !Ref Environment

  DomainDns:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt UiCloudfrontDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront resources HostedZoneId
      HostedZoneId: !FindInMap [EnvironmentMap, !Ref Environment, zoneId]
      Name: !FindInMap [EnvironmentMap, !Ref Environment, domain]
      Type: A

  # Redirect

  RedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      # Runs on viewer-request and returns the redirect itself, so the origin is
      # never contacted. The distributions below still need an origin declared,
      # but no request ever reaches it.
      FunctionCode: !Sub
        - |
          function handler(event) {
            var request = event.request;

            var params = [];
            for (var key in request.querystring) {
              var param = request.querystring[key];
              var values = param.multiValue || [param];
              for (var i = 0; i < values.length; i++) {
                params.push(values[i].value === '' ? key : key + '=' + values[i].value);
              }
            }
            var query = params.length ? '?' + params.join('&') : '';

            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: {
                location: { value: 'https://${Domain}' + request.uri + query },
              },
            };
          }
        - Domain: !FindInMap [EnvironmentMap, !Ref Environment, domain]
      FunctionConfig:
        Comment: !Sub
          - 'Permanent redirect to ${Domain}'
          - Domain: !FindInMap [EnvironmentMap, !Ref Environment, domain]
        Runtime: cloudfront-js-2.0
      Name: !Sub
        - '${Environment}-dbowland-ui-redirect'
        - Environment: !Ref Environment

  RedirectCloudfrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Sub
            - 'www.${Domain}'
            - Domain: !FindInMap [EnvironmentMap, !Ref Environment, domain]
        DefaultCacheBehavior:
          AllowedMethods:
            - 'GET'
            - 'HEAD'
            - 'OPTIONS'
          CachePolicyId: '658327ea-f89d-4fab-a63d-7e88639e58f6' # Managed-CachingOptimized
          Compress: true
          DefaultTTL: 0
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RedirectFunction.FunctionARN
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: 'redirect-to-https'
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        Origins:
          # Never contacted -- RedirectFunction answers every request at the edge.
          - DomainName: !GetAtt UiBucket.RegionalDomainName
            Id: S3Origin
            S3OriginConfig:
              OriginAccessIdentity: !Sub
                - 'origin-access-identity/cloudfront/${Identity}'
                - Identity: !Ref OriginAccessIdentity
        PriceClass: 'PriceClass_100'
        ViewerCertificate:
          AcmCertificateArn: !Sub
            - 'arn:aws:acm:us-east-1:${AWS::AccountId}:certificate/${Certificate}'
            - Certificate: !FindInMap [EnvironmentMap, !Ref Environment, certificate]
          MinimumProtocolVersion: 'TLSv1.2_2021'
          SslSupportMethod: 'sni-only'
      Tags:
        - Key: 'created-by'
          Value: 'dbowland-ui'
        - Key: 'created-for'
          Value: 'dbowland'
        - Key: 'environment'
          Value: !Ref Environment

  RedirectDns:
    Type: AWS::Route53::RecordSet
    Properties:
      AliasTarget:
        DNSName: !GetAtt RedirectCloudfrontDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront resources HostedZoneId
      HostedZoneId: !FindInMap [EnvironmentMap, !Ref Environment, zoneId]
      Name: !Sub
        - 'www.${Domain}'
        - Domain: !FindInMap [EnvironmentMap, !Ref Environment, domain]
      Type: A

  # davidbowland.com redirect (prod only)

  DavidBowlandCloudfrontDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: IsProd
    Properties:
      DistributionConfig:
        Aliases:
          - davidbowland.com
          - www.davidbowland.com
        DefaultCacheBehavior:
          AllowedMethods:
            - 'GET'
            - 'HEAD'
            - 'OPTIONS'
          CachePolicyId: '658327ea-f89d-4fab-a63d-7e88639e58f6' # Managed-CachingOptimized
          Compress: true
          DefaultTTL: 0
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RedirectFunction.FunctionARN
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: 'redirect-to-https'
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        Origins:
          # Never contacted -- RedirectFunction answers every request at the edge.
          - DomainName: !GetAtt UiBucket.RegionalDomainName
            Id: S3Origin
            S3OriginConfig:
              OriginAccessIdentity: !Sub
                - 'origin-access-identity/cloudfront/${Identity}'
                - Identity: !Ref OriginAccessIdentity
        PriceClass: 'PriceClass_100'
        ViewerCertificate:
          AcmCertificateArn: 'arn:aws:acm:us-east-1:494887012091:certificate/4c6d6eeb-6137-481f-b898-595efe3d7f08' # davidbowland.com, *.davidbowland.com
          MinimumProtocolVersion: 'TLSv1.2_2021'
          SslSupportMethod: 'sni-only'
      Tags:
        - Key: 'created-by'
          Value: 'dbowland-ui'
        - Key: 'created-for'
          Value: 'dbowland'
        - Key: 'environment'
          Value: !Ref Environment

  DavidBowlandDns:
    Type: AWS::Route53::RecordSet
    Condition: IsProd
    Properties:
      AliasTarget:
        DNSName: !GetAtt DavidBowlandCloudfrontDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront resources HostedZoneId
      HostedZoneId: Z030236819D5DPAEE4WKN
      Name: davidbowland.com
      Type: A

  DavidBowlandWwwDns:
    Type: AWS::Route53::RecordSet
    Condition: IsProd
    Properties:
      AliasTarget:
        DNSName: !GetAtt DavidBowlandCloudfrontDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront resources HostedZoneId
      HostedZoneId: Z030236819D5DPAEE4WKN
      Name: www.davidbowland.com
      Type: A
